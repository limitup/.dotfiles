# Use vim keybindings in copy mode
setw -g mode-keys vi

# ======== Bindings ========
# reload tmux config file with C-b r
bind r source-file -v ~/.tmux.conf \; display-message "config reloaded"

# bind : to command-prompt like vim
bind : command-prompt

# ======== Global options ========
# use zsh (with oh-my-zsh) instead of the system default-shell
set -g default-shell /usr/bin/zsh

# longer history
set -g history-limit 10000

# set a 256color $TERM variable so programs inside tmux know they can use 256 colors
set -g default-terminal tmux-256color

# update the terminal tab title with session/window info
set -g set-titles on
set -g set-titles-string "#S:#I #W"

# send mouse drag-selection to the system clipboard (Wayland)
set -g mouse on
set -s copy-command "wl-copy"

# plain drag always selects in tmux, even when the app grabs the mouse
# (default bindings forward the press/drag to mouse-reporting apps instead)
bind-key -T root MouseDown1Pane select-pane -t =
bind-key -T root MouseDrag1Pane copy-mode -M

# vi-style copy-mode bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# ======== Sessions ========
bind C new-session
bind L choose-session

set -g update-environment "DISPLAY DISPLAY_MIGRATE WINDOWID SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WAYLAND_DISPLAY XDG_RUNTIME_DIR"

bind K confirm kill-server
bind X confirm kill-window

# Create a new window and prompt for name
bind N command-prompt "new-window -n '%%'"

bind-key P command-prompt -p 'save history to filename:' -I '~/tmux.history' 'capture-pane -S -32768 ; save-buffer %1 ; delete-buffer'

# ======== Splits ========
# horizontal split
bind s split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind ^s split-window -v -c "#{pane_current_path}"

# vertical split
bind v split-window -h -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind ^v split-window -h -c "#{pane_current_path}"

# ======== Panes =========
# move around panes with hjkl, as one would in vim after pressing ctrl+w
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Smart pane switching with awareness of vim splits (see vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# resize panes like vim
bind -r > resize-pane -R 10
bind -r < resize-pane -L 10
bind -r - resize-pane -D 10
bind -r + resize-pane -U 10

# ======== Windows ========
# set window index
set -g base-index 1
setw -g pane-base-index 1

# renumber windows when a window is closed
set-option -g renumber-windows on

# set window colors
set -g status-bg black
set -g status-fg white

# ======== Status Bar ========
# default left side of status bar holds "(>- session name -<)"
set -g status-left-length 100
set -g status-left ''

# default right side of status bar holds current window index and name
set -g status-right-length 100
set -g status-right '#[fg=colour214,bg=colour235] #I #[fg=white,bg=colour236] #W #[default]'

# make background window look like pale white tab
set-window-option -g window-status-format '#[fg=colour250,bg=colour236] #I|#[fg=white,bg=colour236]#W  #[default]'

# make foreground window look like bright foreground tab
set-window-option -g window-status-current-format '#[fg=colour209,bg=colour239] #I|#[fg=colour255,bg=colour239]#W #[default]'
